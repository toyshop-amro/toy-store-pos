<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كاشير متجر الألعاب</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="./manifest.json">

  <!-- مكتبة ماسح الباركوود بالكاميرا -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f2f5; padding: 10px; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #1a73e8; margin-bottom: 12px; font-size: 22px; }
    
    .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

    .card { background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #dadce0; margin-bottom: 12px; }
    .card h3 { margin-bottom: 10px; color: #3c4043; border-bottom: 1px solid #ddd; padding-bottom: 5px; font-size: 16px; }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-success { background: #34a853; color: white; }
    .btn-danger { background: #ea4335; color: white; }
    .btn-warning { background: #f9ab00; color: white; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 350px; overflow-y: auto; }
    .product-item { background: white; border: 2px solid #e0e0e0; border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { border: 1px solid #dadce0; padding: 6px; text-align: center; }
    th { background: #f1f3f4; }
    .edit-input { width: 55px; text-align: center; padding: 4px; border: 1px solid #1a73e8; border-radius: 4px; font-size: 13px; }
    #reader { width: 100%; max-width: 350px; margin: 10px auto; display: none; border: 2px solid #1a73e8; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🧸 كاشير متجر الألعاب الاحترافي</h1>

  <div class="card" style="text-align: center;">
    <button class="btn btn-warning" onclick="toggleScanner()">📷 مسح باركوود بالكاميرا</button>
    <div id="reader"></div>
  </div>

  <div class="grid-layout">
    <div class="card">
      <h3>المنتجات (اضغط للإضافة)</h3>
      <div class="form-group">
        <input type="text" id="searchInput" placeholder="🔍 بحث باسم اللعبة أو الباركوود..." oninput="renderProducts()">
      </div>
      <div id="productGrid" class="product-grid"></div>
    </div>

    <div class="card">
      <h3>🛒 السلة والفاتورة (تعديل السعر والعدد)</h3>
      <table>
        <thead>
          <tr>
            <th>المنتج</th>
            <th>العدد</th>
            <th>سعر البيع</th>
            <th>الإجمالي</th>
            <th>حذف</th>
          </tr>
        </thead>
        <tbody id="cartBody"></tbody>
      </table>
      
      <div style="margin-top: 15px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between;">
        <span>إجمالي الفاتورة:</span>
        <span id="cartTotal" style="color: #137333;">0 ج.م</span>
      </div>
      <button class="btn btn-success" style="margin-top: 10px;" onclick="checkout()">إتمام الفاتورة والبيع 🧾</button>
    </div>
  </div>

  <div class="card" style="margin-top: 15px;">
    <h3>إضافة منتج جديد للمخزن</h3>
    <div class="grid-layout">
      <div class="form-group"><label>اسم اللعبة</label><input type="text" id="pName"></div>
      <div class="form-group"><label>الباركوود (اختياري)</label><input type="text" id="pBarcode"></div>
      <div class="form-group"><label>سعر البيع الافتراضي</label><input type="number" id="pPrice"></div>
    </div>
    <button class="btn btn-primary" onclick="addProduct()">حفظ بالمخزن 💾</button>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  let products = JSON.parse(localStorage.getItem('local_products')) || {};
  let cart = [];
  let html5QrcodeScanner = null;

  window.onload = function() {
    renderProducts();
  };

  function addProduct() {
    const name = document.getElementById('pName').value.trim();
    const barcode = document.getElementById('pBarcode').value.trim();
    const price = parseFloat(document.getElementById('pPrice').value) || 0;
    if (!name || price <= 0) return alert('أدخل الاسم والسعر بشكل صحيح');

    const id = 'p_' + Date.now();
    products[id] = { name, barcode, price };
    localStorage.setItem('local_products', JSON.stringify(products));
    
    document.getElementById('pName').value = '';
    document.getElementById('pBarcode').value = '';
    document.getElementById('pPrice').value = '';
    renderProducts();
    alert('تم حفظ المنتج بالمخزن!');
  }

  function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    const q = document.getElementById('searchInput').value.toLowerCase();

    Object.keys(products).forEach(id => {
      const p = products[id];
      if (q && !p.name.toLowerCase().includes(q) && !(p.barcode && p.barcode.includes(q))) return;
      grid.innerHTML += `
        <div class="product-item" onclick="addToCart('${id}')">
          <div style="font-weight:bold;">${p.name}</div>
          <div style="color:#137333; font-size:12px;">${p.price} ج.م</div>
        </div>
      `;
    });
  }

  function addToCart(id) {
    const p = products[id];
    const existing = cart.find(item => item.id === id);
    if (existing) {
      existing.qty++;
    } else {
      cart.push({ id, name: p.name, price: p.price, qty: 1 });
    }
    renderCart();
  }

  function updateCartPrice(index, newPrice) {
    cart[index].price = parseFloat(newPrice) || 0;
    renderCart();
  }

  function updateCartQty(index, newQty) {
    cart[index].qty = parseInt(newQty) || 1;
    renderCart();
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function renderCart() {
    const tbody = document.getElementById('cartBody');
    tbody.innerHTML = '';
    let total = 0;

    cart.forEach((item, index) => {
      const itemTotal = item.price * item.qty;
      total += itemTotal;
      tbody.innerHTML += `
        <tr>
          <td>${item.name}</td>
          <td><input type="number" class="edit-input" value="${item.qty}" min="1" onchange="updateCartQty(${index}, this.value)"></td>
          <td><input type="number" class="edit-input" value="${item.price}" onchange="updateCartPrice(${index}, this.value)"> ج.م</td>
          <td>${itemTotal} ج.م</td>
          <td><button class="btn btn-danger" style="padding:2px 6px;" onclick="removeFromCart(${index})">X</button></td>
        </tr>
      `;
    });

    document.getElementById('cartTotal').innerText = total + ' ج.م';
  }

  function toggleScanner() {
    const readerDiv = document.getElementById('reader');
    if (readerDiv.style.display === 'block') {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => readerDiv.style.display = 'none');
      }
    } else {
      readerDiv.style.display = 'block';
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (barcode) => {
          let foundId = Object.keys(products).find(id => products[id].barcode === barcode);
          if (foundId) {
            addToCart(foundId);
            alert("تم إضافة: " + products[foundId].name);
          } else {
            alert("باركوود غير مسجل: " + barcode);
          }
        }
      ).catch(() => alert("يرجى إعطاء صلاحية الكاميرا للمتصفح!"));
    }
  }

  function checkout() {
    if (cart.length === 0) return alert('السلة فارغة!');
    alert('تم تسجيل الفاتورة بنجاح! 🧾');
    cart = [];
    renderCart();
  }
</script>
</body>
</html>
