<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاشير محل الألعاب</title>
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; color: #333; }
  .box { background: #fff; width: 100%; max-width: 380px; padding: 24px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,.1); }
  h1 { color: #1a73e8; text-align: center; font-size: 22px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; direction: ltr; text-align: left; }
  button { width: 100%; padding: 12px; margin-top: 14px; border: 0; border-radius: 8px; font-size: 16px; font-weight: bold; color: #fff; background: #1a73e8; cursor: pointer; }
  button.red { background: #ea4335; }
  .msg { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 14px; text-align: center; display: none; }
  .msg.err { display: block; background: #fce8e6; color: #c5221f; }
  .status { display: flex; justify-content: space-between; margin-top: 16px; font-size: 13px; font-weight: bold; }
  .on { color: #137333; } .off { color: #b06000; }
  #appView { display: none; }
</style>
</head>
<body>
<div class="box">
  <h1>🧸 كاشير محل الألعاب</h1>

  <div id="loginView">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" placeholder="admin@cashier.com">
    <label for="pass">كلمة السر</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button id="loginBtn">دخول</button>
    <div id="err" class="msg"></div>
  </div>

  <div id="appView">
    <p style="text-align:center;font-size:17px;font-weight:bold;color:#137333">✅ تم الربط بـ Firebase بنجاح</p>
    <p style="text-align:center;margin-top:8px;direction:ltr" id="who"></p>
    <button id="logoutBtn" class="red">تسجيل الخروج</button>
  </div>

  <div class="status">
    <span id="net"></span>
    <span id="fs">قاعدة البيانات: جاري الاتصال...</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDQ5vyabx8OEW9BYFou7P50VU0rf3FGANU",
  authDomain: "toyshop-pos.firebaseapp.com",
  databaseURL: "https://toyshop-pos-default-rtdb.firebaseio.com",
  projectId: "toyshop-pos",
  storageBucket: "toyshop-pos.firebasestorage.app",
  messagingSenderId: "389217581078",
  appId: "1:389217581078:web:7ba820c6f9995b721fdd37"
});

const auth = getAuth(app);
// تخزين محلي دائم: يخلي التطبيق يشتغل من غير نت ويزامن لما النت يرجع
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
window.db = db; window.auth = auth;

const $ = id => document.getElementById(id);

function showNet() {
  const on = navigator.onLine;
  $('net').textContent = on ? '🟢 متصل بالنت' : '🟠 بدون نت (الشغل محفوظ)';
  $('net').className = on ? 'on' : 'off';
}
addEventListener('online', showNet); addEventListener('offline', showNet); showNet();
$('fs').textContent = 'قاعدة البيانات: جاهزة ✅';

const errors = {
  'auth/invalid-credential': 'البريد أو كلمة السر غلط',
  'auth/invalid-email': 'اكتب البريد بشكل صحيح',
  'auth/too-many-requests': 'محاولات كتير، استنى شوية وجرب تاني',
  'auth/network-request-failed': 'مفيش نت. أول دخول لازم يكون بالنت'
};

$('loginBtn').onclick = async () => {
  $('err').className = 'msg';
  try {
    await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value);
  } catch (e) {
    $('err').textContent = errors[e.code] || ('حصل خطأ: ' + e.code);
    $('err').className = 'msg err';
  }
};
$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  $('loginView').style.display = user ? 'none' : 'block';
  $('appView').style.display = user ? 'block' : 'none';
  if (user) $('who').textContent = user.email;
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
